<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pengumpulan Tugas Magang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-green-100 min-h-screen p-4 sm:p-8 flex items-center justify-center">

    <div class="max-w-md w-full mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-xl border border-emerald-100 relative overflow-hidden">
        
        <!-- Aksen Dekoratif Hijau di Sudut -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-400/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-teal-400/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-6 border-b border-emerald-100 pb-5 relative z-10">
            <div class="inline-flex p-3.5 bg-emerald-100 text-emerald-700 rounded-2xl mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Upload Tugas Magang</h1>
            <p class="text-xs text-slate-500 mt-1">Unggah dokumen laporan atau tugas magang Anda dengan aman.</p>
        </div>

        <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-semibold text-emerald-800 uppercase tracking-wider mb-1.5">Nomor Induk Mahasiswa (NIM)</label>
                <input type="text" id="nimInput" required placeholder="Contoh: 0921357" 
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-emerald-800 uppercase tracking-wider mb-1.5">Password Keamanan</label>
                <input type="password" id="passInput" required placeholder="Masukkan password" 
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-emerald-800 uppercase tracking-wider mb-1.5">Nama / Jenis Tugas</label>
                <input type="text" id="namaTugasInput" required placeholder="Contoh: Laporan Mingguan 1 / Draft Akhir" 
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition duration-200">
                <p class="text-[11px] text-slate-400 mt-1">Bebas ketik nama tugas apa saja.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-emerald-800 uppercase tracking-wider mb-1.5">File Tugas (PDF / Docx / Zip)</label>
                <input type="file" id="fileInput" required 
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-100 file:text-emerald-800 hover:file:bg-emerald-200 cursor-pointer transition duration-200">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 text-sm flex items-center justify-center gap-2 mt-3">
                <span>🚀 Kirim Tugas Sekarang</span>
            </button>
        </form>

        <div id="loadingState" class="hidden text-center py-8 text-slate-500 relative z-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-600 border-t-transparent mb-2"></div>
            <p class="text-xs font-medium text-emerald-800">Sedang mengirim file ke Google Drive & Spreadsheet...</p>
        </div>

        <div id="notifBox" class="hidden mt-4 p-4 rounded-xl text-xs text-center font-semibold relative z-10"></div>

    </div>

    <script>
        // Masukkan URL Web App Google Apps Script Anda di bawah ini
        const apiUrl = "https://script.google.com/macros/s/AKfycbwM5bVfhvaXpOzc7up2DWewfPmnA1EARVDVqS5AlgCJtMaq-HK29aiAMMjsyDlyxTVt/exec";

        function handleUpload(event) {
            event.preventDefault();
            
            const nim = document.getElementById('nimInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const namaTugas = document.getElementById('namaTugasInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const notifBox = document.getElementById('notifBox');
            const loadingState = document.getElementById('loadingState');
            const uploadForm = document.getElementById('uploadForm');

            if (fileInput.files.length === 0) {
                alert("Silakan pilih file tugas terlebih dahulu.");
                return;
            }

            if (apiUrl === "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI") {
                alert("Mohon masukkan URL Web App Apps Script pada file HTML terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            uploadForm.classList.add('hidden');
            loadingState.classList.remove('hidden');
            notifBox.classList.add('hidden');

            reader.onload = function () {
                // Ambil hasil base64 dari file
                const base64Data = reader.result.split(',')[1];

                const payload = {
                    nim: nim,
                    password: password,
                    namaTugas: namaTugas,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                fetch(apiUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(response => {
                    loadingState.classList.add('hidden');
                    uploadForm.classList.remove('hidden');

                    if (response.success) {
                        notifBox.className = "mt-4 p-4 rounded-xl text-xs text-center font-semibold bg-emerald-50 border border-emerald-200 text-emerald-800 shadow-sm";
                        notifBox.innerHTML = `✨ Berhasil! Tugas <b>"${namaTugas}"</b> sukses terkirim ke Google Drive.<br>
                            <a href="${response.fileUrl}" target="_blank" class="text-blue-600 underline mt-1 inline-block font-bold">🔗 Buka File di Drive</a><br>
                            <button onclick="resetForm()" class="mt-3 bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] px-3 py-1.5 rounded-lg shadow transition duration-200 font-medium">Kirim Tugas Lain</button>`;
                    } else {
                        notifBox.className = "mt-4 p-4 rounded-xl text-xs text-center font-semibold bg-rose-50 border border-rose-200 text-rose-700 shadow-sm";
                        notifBox.innerHTML = `❌ ${response.message}`;
                    }
                    notifBox.classList.remove('hidden');
                })
                .catch(err => {
                    loadingState.classList.add('hidden');
                    uploadForm.classList.remove('hidden');
                    notifBox.className = "mt-4 p-4 rounded-xl text-xs text-center font-semibold bg-rose-50 border border-rose-200 text-rose-700 shadow-sm";
                    notifBox.innerHTML = `❌ Gagal terhubung ke server: ${err}`;
                    notifBox.classList.remove('hidden');
                });
            };

            reader.readAsDataURL(file);
        }

        function resetForm() {
            document.getElementById('uploadForm').reset();
            document.getElementById('notifBox').classList.add('hidden');
        }
    </script>
</body>
</html>
